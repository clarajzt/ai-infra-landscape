<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AI Infrastructure Landscape</title>
  <meta name="description" content="An interactive map of the AI infrastructure stack: companies across 24 segments, with sourced funding, revenue, valuation and M&amp;A.">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/atlas.css?v=f8e5d7bb700b">
  <link rel="stylesheet" href="css/landscape.css?v=f8e5d7bb700b">
  <link rel="stylesheet" href="css/site.css?v=f8e5d7bb700b">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button id="atlas-home" class="brand" aria-label="Back to market overview"><img class="brand-icon" src="assets/icon.svg" alt=""><span>AI INFRA LANDSCAPE</span></button>
      <nav id="atlas-tabs" class="top-tabs" aria-label="Main navigation">
        <button data-view="market" class="active">Market overview</button>
        <button data-view="companies">Company map</button>
        <button data-view="research">Evolution and opportunities</button>
        <a href="about.html">About</a>
      </nav>
      <div class="top-actions"><span id="atlas-snapshot"></span><button id="atlas-export" class="btn">Export ↓</button><a class="btn source-link" href="https://github.com/clarajzt/ai-infra-landscape" rel="noopener">GitHub ↗</a></div>
    </div>
  </header>
  <main class="atlas-main">
    <section id="atlas-filterbar" class="filterbar" aria-label="Map filters">
      <label>Year<select id="atlas-year"><option value="2026">2026 YTD</option><option value="2025">2025</option><option value="2024">2024</option><option value="2023">2023</option><option value="all">2023–2026 all</option></select></label>
      <label>Main operating country<select id="atlas-country"><option value="">All countries</option></select></label>
      <label>Layer<select id="atlas-primary"><option value="">All layers</option></select></label>
      <label>Segment<select id="atlas-secondary"><option value="">All segments</option></select></label>
      <label class="search-label"><span class="sr-only">Search companies and products</span><input id="atlas-search" type="search" placeholder="Search companies, products, keywords…" autocomplete="off"></label>
      <button id="atlas-reset" class="text-btn">Reset</button>
    </section>
    <div id="atlas-content" aria-live="polite"><div class="loading">Loading the market map…</div></div>
    <footer id="atlas-footer" class="page-footer"></footer>
  </main>
  <footer class="site-footer"><a href="about.html">About</a><a href="about.html#data">Data</a><a href="https://github.com/clarajzt/ai-infra-landscape" rel="noopener">Source on GitHub</a><span class="note">Not investment advice</span></footer>
  <dialog id="atlas-detail" aria-labelledby="atlas-detail-title">
    <div class="dialog-header"><div><button id="atlas-detail-back" class="text-btn" hidden>← Back to breakdown</button><div id="atlas-detail-eyebrow" class="eyebrow"></div><h2 id="atlas-detail-title"></h2></div><button id="atlas-detail-close" class="close-btn" aria-label="Close details">×</button></div>
    <div id="atlas-detail-body" class="dialog-body"></div>
  </dialog>
  <script src="js/boot.js?v=f8e5d7bb700b" defer></script>
</body>
</html>
